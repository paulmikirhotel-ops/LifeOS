<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>LifeOS - offline</title>
    <style>
      :root { --bg: #f8fafc; --fg: #0f172a; --muted: #475569; --accent: #4f46e5; --accent-fg: #ffffff; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #020617; --fg: #e2e8f0; --muted: #94a3b8; --accent: #818cf8; --accent-fg: #0b1020; }
      }
      html, body { margin: 0; min-height: 100%; }
      body {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg); color: var(--fg);
        display: flex; align-items: center; justify-content: center; text-align: center;
        padding: 24px max(24px, env(safe-area-inset-right, 0px)) 24px max(24px, env(safe-area-inset-left, 0px));
        box-sizing: border-box; min-height: 100vh;
      }
      main { max-width: 22rem; }
      h1 { font-size: 1.4rem; margin: 0 0 0.5rem; }
      p { color: var(--muted); line-height: 1.5; margin: 0 0 1.5rem; }
      button {
        font: inherit; font-weight: 600; border: 0; border-radius: 0.75rem; cursor: pointer;
        padding: 0.8rem 1.6rem; background: var(--accent); color: var(--accent-fg);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>LifeOS could not reach the internet. Check your connection (Wi-Fi or mobile data), then try again.</p>
      <button id="retry" type="button">Try again</button>
    </main>
    <script>
      document.getElementById('retry').addEventListener('click', function () {
        location.href = 'https://lifepilot-os.netlify.app/';
      });
      // When the connection comes back, reopen the app on its own.
      window.addEventListener('online', function () {
        location.href = 'https://lifepilot-os.netlify.app/';
      });
    </script>
  </body>
</html>
