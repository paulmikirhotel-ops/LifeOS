<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LifeOS — offline</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a; text-align: center; padding: 24px; }
  @media (prefers-color-scheme: dark) { body { background: #020617; color: #e2e8f0; } }
  img { width: 72px; height: 72px; border-radius: 18px; background: #000; }
  h1 { font-size: 22px; margin: 16px 0 6px; }
  p { margin: 0 0 20px; color: #64748b; max-width: 32ch; }
  button { background: #2563eb; color: #fff; border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 700; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>LifeOS needs an internet connection to load your data. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
